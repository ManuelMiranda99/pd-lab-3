[project]
name = "novapedidos"
version = "0.1.0"
description = "NovaDistribuidora: convierte mensajes de WhatsApp en pedidos estructurados con LLMs (LangChain + OpenRouter)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novapedidos"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "requiere_datos: necesita los parquet publicados en DATOS_DIR (se salta si no están)",
    "requiere_llm: llama a OpenRouter de verdad (se salta sin OPENROUTER_API_KEY)",
]
